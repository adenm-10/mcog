# @package _global_
name: four_rooms
cell_size: 1.0
walls: |
  #############
  #.....#.....#
  #.....#.....#
  #...........#
  #.....#.....#
  #.....#.....#
  ###.#####.###
  #.....#.....#
  #.....#.....#
  #...........#
  #.....#.....#
  #.....#.....#
  #############
regions: |
  #############
  #11111#22222#
  #11111#22222#
  #11111122222#
  #11111#22222#
  #11111#22222#
  ###1#####2###
  #33333#44444#
  #33333#44444#
  #33333344444#
  #33333#44444#
  #33333#44444#
  #############
interfaces:
  # ===== vertical doorways (left<->right) =====
  - between: [1, 2]                # door cell col=6, text_row=3
    rect: [6.0, 9.0, 7.0, 10.0]
    target_ab: [6.9, 9.5]        # 1->2 : into R2 (right)
    target_ba: [6.1, 9.5]        # 2->1
    line: {p0: [6.5, 9.0], p1: [6.5, 10.0]}
  # ===== horizontal doorways (top<->bottom) =====
  - between: [1, 3]                # door cell col=3, text_row=6
    rect: [3.0, 6.0, 4.0, 7.0]
    target_ab: [3.5, 6.1]        # 1->3 : into R3 (below)
    target_ba: [3.5, 6.9]        # 3->1
    line: {p0: [3.0, 6.5], p1: [4.0, 6.5]}
  - between: [2, 4]                # door cell col=9, text_row=6
    rect: [9.0, 6.0, 10.0, 7.0]
    target_ab: [9.5, 6.1]        # 2->4 : into R4 (below)
    target_ba: [9.5, 6.9]        # 4->2
    line: {p0: [9.0, 6.5], p1: [10.0, 6.5]}
  # ===== vertical doorways (left<->right) =====
  - between: [3, 4]                # door cell col=6, text_row=9
    rect: [6.0, 3.0, 7.0, 4.0]
    target_ab: [6.9, 3.5]        # 3->4 : into R4 (right)
    target_ba: [6.1, 3.5]        # 4->3
    line: {p0: [6.5, 3.0], p1: [6.5, 4.0]}