name: large
cell_size: 1.0
walls: |
  ############
  #..#...#...#
  ##.#.#.#.###
  #..#.#.....#
  #.####.###.#
  #......#...#
  #.##.#.#.#.#
  #....#.....#
  ############
regions: |
  ############
  #11#444#777#
  ##1#4#4#7###
  #11#4#45555#
  #1####3###5#
  #222233#666#
  #2##2#3#6#6#
  #2222#33666#
  ############

interfaces:
  # - between: [1, 2] REGIONS
  #   rect: [1.5, 5.5, 2.5, 6.5] X1, Y1, X2, Y2
  #   target_ab: [2.6, 6.0] TARGET POINT FOR SECTION 1
  #   target_ba: [1.4, 6.0] TARGET POINT FOR SECTION 2
  #   line: {p0: [1.5, 6.0], p1: [2.5, 6.0]} POLICY SWITCHING LINE
  - between: [1, 2]
    rect: [1.0, 4.0, 2.0, 5.0]
    target_ab: [1.5, 4.1]        # 1->2 downward
    target_ba: [1.5, 4.9]        # 2->1 upward
    line: {p0: [1.0, 4.5], p1: [2.0, 4.5]}
  - between: [2, 3]
    rect: [5.0, 3.0, 6.0, 4.0]     # was [1.5, 1.0, 2.5, 2.0]
    target_ab: [5.9, 3.5]        # 2->3 rightward
    target_ba: [5.1, 3.5]        # 3->2 leftward
    line: {p0: [5.5, 3.0], p1: [5.5, 4.0]}
  - between: [3, 4]
    rect: [6.0, 4.0, 7.0, 5.0]
    target_ab: [6.5, 4.9]        # 3->4 upward
    target_ba: [6.5, 4.1]        # 4->3 downward
    line: {p0: [6.0, 4.5], p1: [7.0, 4.5]}
  - between: [4, 5]
    rect: [7.0, 5.0, 8.0, 6.0]     # was [6.5, 5.0, 7.5, 6.0]
    target_ab: [7.9, 5.5]        # 4->5 rightward
    target_ba: [7.1, 5.5]        # 5->4 leftward
    line: {p0: [7.5, 5.0], p1: [7.5, 6.0]}
  - between: [5, 6]
    rect: [10.0, 4.0, 11.0, 5.0]   # was [10.0, 3.5, 11.0, 4.5]
    target_ab: [10.5, 4.1]        # 5->6 downward
    target_ba: [10.5, 4.9]        # 6->5 upward
    line: {p0: [10.0, 4.5], p1: [11.0, 4.5]}
  - between: [3, 6]
    rect: [7.0, 1.0, 8.0, 2.0]     # was [6.0, 2.5, 7.0, 3.5]; border is now vertical
    target_ab: [7.9, 1.5]        # 3->6 rightward
    target_ba: [7.1, 1.5]        # 6->3 leftward
    line: {p0: [7.5, 1.0], p1: [7.5, 2.0]}
  - between: [5, 7]                # NEW: only 5<->7 contact; region 7 was orphaned without this
    rect: [8.0, 6.0, 9.0, 7.0]
    target_ab: [8.5, 6.9]        # 5->7 upward
    target_ba: [8.5, 6.1]        # 7->5 downward
    line: {p0: [8.0, 6.5], p1: [9.0, 6.5]}