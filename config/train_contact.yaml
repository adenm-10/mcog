# config/train_contact.yaml -- top-level Hydra config for train_contact.py.
# `contact` selects push/recontact (config/contact/{push,recontact}.yaml).
# Override any key with key=value on the command line.
defaults:
  - _self_
  - contact: ???
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled

hydra:
  run: {dir: .}
  job: {chdir: false}
  output_subdir: null   # stops both a .hydra/ dump AND a stray
                         # train_contact.log mirroring stdout into the repo
                         # root on every run

# --- procedural ---
seed: 0
total_steps: 100000
n_envs: 1
out_dir: null
diag_eval_freq: 5000
diag_eval_episodes: 16
learning_starts: null       # null -> horizon + 50 (HerReplayBuffer can't sample
                             # before the first episode ends)
wandb: false
wandb_project: mcog
wandb_run_name: null
wandb_group: null          # null -> old behavior (out_dir's basename); set explicitly
                            # to group many sweep runs under one wandb "group" banner
use_her: true              # false -> plain SAC replay buffer, no goal relabeling
target_clip: null          # clamp the critic's TD target to [0, this]. null -> stock
                           # SAC. With a one-shot terminal bonus and every other
                           # reward weight zeroed, Q* <= goal_reward exactly, so
                           # target_clip=${goal_reward} is a provable bound, not a
                           # tuning knob -- see domains/contact/sac_clipped.py.
her_n_sampled_goal: 4      # HerReplayBuffer's relabels-per-real-transition (SB3 default 4)

# --- eval_contact.py only (standalone checkpoint scorer; ignored by training) ---
eval_ckpt: null                          # path to a .zip saved by train_contact.py
eval_episodes_per_bin: 12                # stratified set: episodes per distance bin
eval_dist_edges: [3.0, 6.0, 9.0, 12.0]   # bin edges (cm) -> len+1 bins
eval_max_reject: 20000                   # rejection-sampling budget for the whole set
eval_out: null                           # json path; null -> beside the checkpoint
eval_summary_png: false                  # success-by-bin + termination + progress figure
eval_video: false                        # mp4 per selected episode (~8KB each)
eval_video_n: 4                          # how many episodes to render
eval_video_pick: auto                    # auto | arrived | failed. auto mixes
                                         # successes and failures; arrived shows
                                         # the hardest successes first.
eval_video_fps: 12
eval_media_dir: null                     # null -> media/eval/<cell>/. LOCAL DISK ONLY:
                                         # nothing here is ever uploaded (limited wandb
                                         # storage), and visualize.py has no wandb import.

# --- env / arrival ---
horizon: null                # set per-template in config/contact/*.yaml
arrival_eps: 0.4

# --- PlanarFingertipParams (planar_fingertips.py) ---
board_w_cm: 80.0
board_h_cm: 60.0
object_w_cm: 10.0
object_h_cm: 6.0
object_mass_kg: 0.20
table_friction: 0.40
finger_friction: 0.75
angular_drag_arm_cm: 6.0
finger_radius_cm: 1.2
finger_mass_kg: 0.05
finger_gain: 10.0
v_max_cm_s: 20.0
physics_hz: 500.0
policy_hz: 25.0
wall_thickness_cm: 0.3
wall_friction: 0.30
collision_threshold_cm: 0.05
force_abort_kgcms2: null
portals: []
object_start_xy: null

# --- RewardWeights (reward.py) ---
goal_reward: 10.0
w_d: 0.0
w_a: 0.0
w_F: 0.0
w_m: 0.0
w_T: 0.0
force_max: null

# --- curriculum constants (formerly bare module-level globals in gym_env.py) ---
wall_margin_cm: 6.0
disengaged_reach_mult: 2.0
same_room_goal_prob: 0.0  # push only -- goal drawn from the source room instead
                          # of an adjacent one with this probability (0.0 = old
                          # behavior, always cross-room)
push_cone_deg: null       # push only -- half-angle (deg) of the cone around the
                          # contacted face's own push direction that the goal is
                          # drawn from, so face and goal are consistent and one
                          # push can reach the goal (memo Eq 7/12). null keeps the
                          # historical sampler, whose face exclusion misjudges
                          # "nearest the goal" and puts the finger on the goal side
                          # in 40-57% of resets -- kept as a faithful control.
push_range_min_cm: null   # push only, cone sampler only -- floor on the goal's
                          # distance from the object at reset. null keeps the
                          # historical draw (near end = arrival_eps), which puts
                          # 5 of the 60 benchmark episodes under 1cm, i.e. goals
                          # the object is already almost on. Rays too short to
                          # hold the floor are rejected, not clamped.
object_theta_spread_deg: null  # push only, cone sampler only -- half-width (deg)
                          # of the uniform spread the object's INITIAL HEADING is
                          # drawn from. null keeps the historical fixed 0 deg
                          # (measured 300/300 before v29), draws no extra random
                          # number, and is bit-identical. Requires push_cone_deg:
                          # the historical sampler picks the face from an
                          # axis-aligned table and would be inconsistent.
gap_assist: true          # contact_frame only -- forbid commanding retreat faster
                          # than the object recedes. An ASSIST, not physics: a real
                          # finger may back away. It is what makes contact_lost a
                          # consequence of sliding off a corner rather than of the
                          # policy simply letting go. finger_velocity has never had
                          # it, so false is the midpoint of full -> raw.
restrict_contact_actions: false  # push only -- clamp the active finger's
                          # outward-normal velocity to the object's own when
                          # it would otherwise open the contact gap
action_interface: finger_velocity  # push only. finger_velocity = the historical
                          # raw (vx,vy) per finger, held constant across a whole
                          # policy tick. contact_frame = (push, slide) along the
                          # contacted face's normal/tangent, re-derived every
                          # physics substep so the finger cannot slide across a
                          # face before anything reacts (memo Table 3's
                          # "contact-aware control interface" ablation).
slip_model: speed_fraction # contact_frame only -- how the tangential
                          # (face-parallel) budget is set. speed_fraction: a flat
                          # ceiling, `slip_limit` below. At slip_limit=1.0 the only
                          # limits left are the whole-command clamp to v_max and
                          # "no pulling", so the finger may slide along a face with
                          # no push and pymunk's own contact friction (mu=0.75)
                          # decides what the object does -- friction is modelled
                          # ONCE, by the solver. friction_cone additionally caps
                          # |v_t| at mu * push * v_max; that is a second friction
                          # model on top of the solver's, and it froze the finger
                          # whenever push went to zero. DEPRECATED -- ablation arm
                          # only, never the default. Measured cost at 400k, same 60
                          # episodes, single-factor: 0.283 with the cone against
                          # 0.739 without it. It also CAPS the ceiling -- the cone
                          # arm's eval curve flattened at ~0.26 by 200k while the
                          # flat arm kept climbing to 0.68 (docs/PROGRESS.md v28).
                          # NOT deleted: the v26/v27 archived cells trained with it
                          # and must stay replayable.
slip_limit: 1.0           # speed_fraction only -- tangential ceiling as a fraction
                          # of v_max. 1.0 = no tangential limit beyond v_max.
mask_inactive_finger: true  # push only -- true zeroes the non-pushing finger's
                          # action, which leaves it servo-held wherever it spawned
                          # and in the travelling object's path (measured:
                          # forbidden_contact 8% -> 17-19% once pushes got long).
                          # false gives the policy both fingers and leaves the
                          # Eq 40 guard as the only thing keeping it clear.
                          # Default stays true so archived checkpoints replay.
disengaged_away_deg: null # push only -- half-angle (deg) of the cone the
                          # disengaged finger spawns in, centred on the active
                          # face's outward normal (i.e. behind the object's
                          # travel). null -> the historical uniform ring.

# --- settle thresholds (contact_templates.py) -- null -> module constants
# (0.5cm/s, 5deg/s). Overridable so they're sweepable.
eps_v_cm_s: null
eps_omega_deg_s: null

# --- H1/H3 ablations (status.md sec 7.9) ---
# false: episodes run the full horizon past a guard violation instead of
# ending early (the "bail early, cheap" exit).
guard_terminates: true
# A relabeled goal must be this far (cm) from the object's position right
# BEFORE the transition being relabeled (per-pair, not per-episode) before HER
# grants credit -- null disables. Needs copy_info_dict=True (wired
# automatically in train_contact.py). Must stay strictly below arrival_eps or
# the gate goes near-silent -- see status.md's gotcha.
min_progress_cm: null
# Preferred over min_progress_cm: a HER-relabeled goal must be drawn at least
# this many ticks ahead of the transition being relabeled -- null disables.
# Invariant to object speed, so unlike the cm version it cannot alias with
# arrival_eps. Push only (needs her_buffer.py's lag capture).
min_progress_ticks: null
# Push only -- true requires the object to be settled (low velocity, not
# just close) for reached_interface/is_success/termination/reward, matching
# push_arrival's own definition. false uses reached_position instead (pure
# distance, no velocity check) for those same four things, closing the gap
# with HER's compute_reward, which was already position-only for push.
require_settled: true
