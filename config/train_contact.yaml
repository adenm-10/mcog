# config/train_contact.yaml -- top-level Hydra config for train_contact.py.
# `contact` selects push/recontact (config/contact/{push,recontact}.yaml).
# Override any key with key=value on the command line.
defaults:
  - _self_
  - contact: ???
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled

hydra:
  run: {dir: .}
  job: {chdir: false}
  output_subdir: null   # stops both a .hydra/ dump AND a stray
                         # train_contact.log mirroring stdout into the repo
                         # root on every run

# --- procedural ---
seed: 0
total_steps: 100000
n_envs: 1
out_dir: null
diag_eval_freq: 5000
diag_eval_episodes: 16
ckpt_freq: null              # null -> OFF (default; bit-identical to before). Set to a
                             # step interval to also save model_<step>.zip snapshots.
                             # Deliberately off by default: at 3.26 MB each these are
                             # exactly what tools/prune_runs.py exists to contain
                             # (docs/TODO.md Housekeeping). Turn it on for a sweep that
                             # needs a BUDGET-MATCHED comparison against an earlier run
                             # at a smaller cap, or a sample-efficiency curve
                             # (memo Eq 37/38, N_rho and AULC), then prune after scoring.
learning_starts: null       # null -> horizon + 50 (HerReplayBuffer can't sample
                             # before the first episode ends)
wandb: false
wandb_project: mcog
wandb_run_name: null
wandb_group: null          # null -> old behavior (out_dir's basename); set explicitly
                            # to group many sweep runs under one wandb "group" banner
# --- algorithm ---
# NAMED rl_algo, not `algo`: `config/algo/` is nav's Hydra config GROUP
# (config/algo/{sac,ppo}.yaml), so `algo=ppo` on the CLI is parsed as a group
# override and dies with "No match in the defaults list". Do not rename back.
#
# sac: SAC+HER, everything this repo has ever run. ppo: memo sec 4's
# "PPO as an algorithm-independence replication" (Table 4).
#
# PPO IS ON-POLICY, so three SAC-only things are REFUSED rather than ignored:
# use_her (no replay buffer to relabel into), target_clip (a TD-target clamp
# that has no analogue), and learning_starts. train_contact raises on each,
# because silently dropping a flag a launcher passed is how the v29 w_m sweep
# trained 8 cells at the wrong value.
#
# AND PPO WITHOUT DENSE SHAPING IS EXPECTED TO FAIL. It has no HER, so a pure
# sparse arrival bonus gives it essentially no gradient -- push's untrained
# floor is 0.042. Pair `rl_algo=ppo` with the w_* terms; train_contact warns
# loudly if you do not.
rl_algo: sac
# PPO only. `n_steps` is the TOTAL rollout across envs and must divide n_envs
# -- same convention as train.py/config/algo/ppo.yaml, so the two files read
# alike. Memo Table 4 asks for 2048-8192 steps/update, hence 4096 with the
# n_envs=8 a PPO run wants.
n_steps: 4096
batch_size: 256
n_epochs: 10
gae_lambda: 0.95
ent_coef: 0.0             # Table 4 allows 0.0-0.01. 0.0 by default: contact's
                          # action space is 2 live dims under masking, and an
                          # entropy bonus is what the affine `push` remap exists
                          # to avoid needing.
clip_range: 0.2
learning_rate: 0.0003     # Table 4, both algos. SAC's SB3 default is the same
                          # value, so passing it explicitly is bit-identical.
lr_linear_decay: false    # Table 4 says "3e-4 with linear decay" for PPO. Off by
                          # default so a run is reproducible from one number.
# BOTH algos. null -> SB3's own default, which DIFFERS by algorithm: SAC gets
# [256, 256] and PPO only [64, 64], i.e. PPO would carry ~16x fewer parameters.
# So `null` resolves to [256, 256] for PPO too, matching SAC exactly -- memo
# sec 9 requires the advantage to survive a control for total network capacity,
# and an unfair capacity gap would confound the whole comparison. Table 4's
# literal 3x256 is available as an override and is a recorded deviation.
net_arch: null
use_her: true              # false -> plain SAC replay buffer, no goal relabeling
target_clip: null          # clamp the critic's TD target to [0, this]. null -> stock
                           # SAC. With a one-shot terminal bonus and every other
                           # reward weight zeroed, Q* <= goal_reward exactly, so
                           # target_clip=${goal_reward} is a provable bound, not a
                           # tuning knob -- see domains/contact/sac_clipped.py.
her_n_sampled_goal: 4      # HerReplayBuffer's relabels-per-real-transition (SB3 default 4)

# --- eval_contact.py only (standalone checkpoint scorer; ignored by training) ---
eval_ckpt: null                          # path to a .zip saved by train_contact.py
eval_episodes_per_bin: 12                # stratified set: episodes per distance bin
eval_dist_edges: [3.0, 6.0, 9.0, 12.0]   # bin edges (cm) -> len+1 bins
eval_max_reject: 20000                   # rejection-sampling budget for the whole set
eval_out: null                           # json path; null -> beside the checkpoint
eval_summary_png: false                  # success-by-bin + termination + progress figure
eval_video: false                        # mp4 per selected episode (~8KB each)
eval_video_n: 4                          # how many episodes to render
eval_video_pick: auto                    # auto | arrived | failed | informative.
                                         # successes and failures; arrived shows
                                         # the hardest successes first.
eval_video_fps: 12
eval_media_dir: null                     # null -> media/eval/<cell>/. LOCAL DISK ONLY:
                                         # nothing here is ever uploaded (limited wandb
                                         # storage), and visualize.py has no wandb import.

# --- env / arrival ---
horizon: null                # set per-template in config/contact/*.yaml
arrival_eps: 0.4

# --- PlanarFingertipParams (planar_fingertips.py) ---
board_w_cm: 80.0
board_h_cm: 60.0
object_w_cm: 10.0
object_h_cm: 6.0
object_mass_kg: 0.20
table_friction: 0.40
finger_friction: 0.75
# 3.12, not 6.0, since 2026-09-03. tau = mu*m*g*L, and for a body sliding on a
# plane L is the PRESSURE-WEIGHTED MEAN RADIUS of the contact patch: uniform
# pressure over a 10x6cm rectangle gives 3.12cm, and 5.83cm (the half-diagonal,
# all load on the two farthest corners) is the hard ceiling. The old 6.0 was
# above that ceiling, i.e. NO pressure distribution can produce it. Costed at
# zero: v29's physdamp arm measured 0.739 -> 0.706 on the identical 60 episodes
# (paired mean -0.033) and held under both checkpoints, so the unphysical value
# was never buying performance. Every v32/v33 cell already passed 3.12
# explicitly, so their digests are unaffected.
angular_drag_arm_cm: 3.12
finger_radius_cm: 1.2
finger_mass_kg: 0.05
finger_gain: 10.0
v_max_cm_s: 20.0
physics_hz: 500.0
policy_hz: 25.0
wall_thickness_cm: 0.3
wall_friction: 0.30
collision_threshold_cm: 0.05
force_abort_kgcms2: null
portals: []
object_start_xy: null

# --- RewardWeights (reward.py) ---
goal_reward: 10.0
w_d: 0.0
w_a: 0.0
w_F: 0.0
w_m: 0.0
w_T: 0.0
force_max: null
# --- dense shaping, all 0.0 by default so every archived config is unchanged ---
# READ reward.py's RewardWeights docstring before setting any of these. Two
# constraints are measured, not stylistic:
#   1. every guard penalty must stay well BELOW goal_reward. At w_m=50/100 push
#      learned to PARK THE OBJECT AGAINST A WALL -- pinned there it cannot
#      slide, so contact-loss becomes impossible and the guard is satisfied
#      forever at the cost of ever finishing. A bigger penalty made that trade
#      MORE attractive (docs/PROGRESS.md v16).
#   2. w_settle MUST stay proximity-gated (settle_radius_cm). Ungated it is
#      maximised by not moving, i.e. the same cheat.
# Turning ANY of these on invalidates target_clip, whose [0, goal_reward] bound
# is only provable under pure sparse -- ContactEnv raises if you do both.
w_guard: null             # per-outcome guard penalty, e.g.
                          # '{contact_lost: 2.0, wrong_face: 2.0, forbidden_contact: 3.0, off_board: 5.0}'
                          # Keys from reward.GUARD_OUTCOMES; unlisted -> w_m.
w_hold: 0.0               # per tick, ONLY while the required contact is held AND
                          # on the commanded face. One conjunction, not two terms.
                          # MEASURED: at 0.02 on a 200-tick horizon a 2k-step run
                          # hit ep_rew_mean 4.57 with success_rate 0.0 and every
                          # episode at full horizon -- "hold and stall" was worth
                          # 46% of the arrival bonus. Start at 0.005-0.01.
hold_cap: 2.0             # ceiling on the hold bonus per EPISODE, so a per-tick
                          # bonus cannot scale with the horizon.
w_settle: 0.0             # per tick, ONLY while settled AND within settle_radius_cm
settle_radius_cm: 1.2     # 3x arrival_eps. The gate that stops "stand still" winning.
settle_cap: 0.5           # ceiling on the settle bonus per EPISODE
w_prog: 0.0               # POTENTIAL-BASED distance shaping: rewards the REDUCTION
                          # in distance, so it is policy-invariant (Ng et al. 1999).
                          # Use this, never w_d -- w_d charges the ABSOLUTE distance
                          # every tick, which at 0.005 costs a 20cm goal -20 over
                          # 200 ticks, TWICE the arrival bonus. That arithmetic is
                          # why "bailing out was cheaper than attempting the task".
w_arrive_pos: 0.0         # one-shot bonus for POSITION-only arrival, so the settle
                          # requirement is a gradient rather than a cliff (53% of
                          # push's failures already land within 1cm).

# --- curriculum constants (formerly bare module-level globals in gym_env.py) ---
wall_margin_cm: 6.0
disengaged_reach_mult: 2.0
same_room_goal_prob: 0.0  # push only -- goal drawn from the source room instead
                          # of an adjacent one with this probability (0.0 = old
                          # behavior, always cross-room)
push_cone_deg: null       # push only -- half-angle (deg) of the cone around the
                          # contacted face's own push direction that the goal is
                          # drawn from, so face and goal are consistent and one
                          # push can reach the goal (memo Eq 7/12). null keeps the
                          # historical sampler, whose face exclusion misjudges
                          # "nearest the goal" and puts the finger on the goal side
                          # in 40-57% of resets -- kept as a faithful control.
push_range_min_cm: null   # push only, cone sampler only -- floor on the goal's
                          # distance from the object at reset. null keeps the
                          # historical draw (near end = arrival_eps), which puts
                          # 5 of the 60 benchmark episodes under 1cm, i.e. goals
                          # the object is already almost on. Rays too short to
                          # hold the floor are rejected, not clamped.
push_spawn_along_frac: null # PUSH ONLY. Half-width, as a FRACTION of the
                          # half-face, of the uniform spread the active
                          # finger's contact point is drawn from ACROSS the
                          # contacted face. null keeps the historical face
                          # CENTRE (measured max along-face offset 0.0000cm over
                          # 400 resets), draws no extra random number, and is
                          # bit-identical. Max 0.9: a contact ON the corner
                          # makes nearest_face flip on rounding, which is why
                          # contact_templates caps its own interface sampler at
                          # ALONG_MAX_FACE=0.7.
                          #
                          # NOT COSMETIC, and not just the memo's "random point
                          # along the face". A contact at the face CENTRE
                          # pushing along the inward normal produces EXACTLY
                          # ZERO torque -- the lever arm is parallel to the
                          # force. All of push's rotation authority came from
                          # the friction-limited tangential component, which is
                          # why net rotation measures a median 1.8deg/episode
                          # against a +/-45deg goal window. So this GATES any
                          # orientation-diversity experiment: widening the
                          # window without it only adds unwinnable episodes.
                          # A TASK key -- it moves the reset distribution and
                          # the digest, so the untrained floor is regenerated
                          # with it.
object_theta_spread_deg: null  # push only, cone sampler only -- half-width (deg)
                          # of the uniform spread the object's INITIAL HEADING is
                          # drawn from. null keeps the historical fixed 0 deg
                          # (measured 300/300 before v29), draws no extra random
                          # number, and is bit-identical. Requires push_cone_deg:
                          # the historical sampler picks the face from an
                          # axis-aligned table and would be inconsistent.
gap_assist: true          # contact_frame only -- forbid commanding retreat faster
                          # than the object recedes. An ASSIST, not physics: a real
                          # finger may back away. It is what makes contact_lost a
                          # consequence of sliding off a corner rather than of the
                          # policy simply letting go. finger_velocity has never had
                          # it, so false is the midpoint of full -> raw.
restrict_contact_actions: false  # push only -- clamp the active finger's
                          # outward-normal velocity to the object's own when
                          # it would otherwise open the contact gap
action_interface: finger_velocity  # push only. finger_velocity = the historical
                          # raw (vx,vy) per finger, held constant across a whole
                          # policy tick. contact_frame = (push, slide) along the
                          # contacted face's normal/tangent, re-derived every
                          # physics substep so the finger cannot slide across a
                          # face before anything reacts (memo Table 3's
                          # "contact-aware control interface" ablation).
slip_model: speed_fraction # contact_frame only -- how the tangential
                          # (face-parallel) budget is set. speed_fraction: a flat
                          # ceiling, `slip_limit` below. At slip_limit=1.0 the only
                          # limits left are the whole-command clamp to v_max and
                          # "no pulling", so the finger may slide along a face with
                          # no push and pymunk's own contact friction (mu=0.75)
                          # decides what the object does -- friction is modelled
                          # ONCE, by the solver. friction_cone additionally caps
                          # |v_t| at mu * push * v_max; that is a second friction
                          # model on top of the solver's, and it froze the finger
                          # whenever push went to zero. DEPRECATED -- ablation arm
                          # only, never the default. Measured cost at 400k, same 60
                          # episodes, single-factor: 0.283 with the cone against
                          # 0.739 without it. It also CAPS the ceiling -- the cone
                          # arm's eval curve flattened at ~0.26 by 200k while the
                          # flat arm kept climbing to 0.68 (docs/PROGRESS.md v28).
                          # NOT deleted: the v26/v27 archived cells trained with it
                          # and must stay replayable.
slip_limit: 1.0           # speed_fraction only -- tangential ceiling as a fraction
                          # of v_max. 1.0 = no tangential limit beyond v_max.
mask_inactive_finger: true  # push only -- true zeroes the non-pushing finger's
                          # action, which leaves it servo-held wherever it spawned
                          # and in the travelling object's path (measured:
                          # forbidden_contact 8% -> 17-19% once pushes got long).
                          # false gives the policy both fingers and leaves the
                          # Eq 40 guard as the only thing keeping it clear.
                          # Default stays true so archived checkpoints replay.
disengaged_away_deg: null # push only -- half-angle (deg) of the cone the
                          # disengaged finger spawns in, centred on the active
                          # face's outward normal (i.e. behind the object's
                          # travel). null -> the historical uniform ring.

# --- settle thresholds (contact_templates.py) -- null -> module constants
# (0.5cm/s, 5deg/s). Overridable so they're sweepable.
eps_v_cm_s: null
eps_omega_deg_s: null

# --- H1/H3 ablations (status.md sec 7.9) ---
# false: episodes run the full horizon past a guard violation instead of
# ending early (the "bail early, cheap" exit).
guard_terminates: true
# A relabeled goal must be this far (cm) from the object's position right
# BEFORE the transition being relabeled (per-pair, not per-episode) before HER
# grants credit -- null disables. Needs copy_info_dict=True (wired
# automatically in train_contact.py). Must stay strictly below arrival_eps or
# the gate goes near-silent -- see status.md's gotcha.
min_progress_cm: null
# Preferred over min_progress_cm: a HER-relabeled goal must be drawn at least
# this many ticks ahead of the transition being relabeled -- null disables.
# Invariant to object speed, so unlike the cm version it cannot alias with
# arrival_eps. Push only (needs her_buffer.py's lag capture).
min_progress_ticks: null
# Push only -- true requires the object to be settled (low velocity, not
# just close) for reached_interface/is_success/termination/reward, matching
# push_arrival's own definition. false uses reached_position instead (pure
# distance, no velocity check) for those same four things, closing the gap
# with HER's compute_reward, which was already position-only for push.
require_settled: true
theta_tol_deg: null          # PUSH ONLY. Eq 13's orientation bin half-width (deg).
                             # null (default) = 2-D position goal, bit-identical to
                             # every run so far AND keeps archived checkpoints
                             # loadable (SB3 bakes the goal Box into the zip).
                             # Set it and the goal becomes a POSE (x,y,cos,sin),
                             # obs() grows a relative-heading pair, and arrival
                             # requires position AND bin.
theta_goal_window_deg: null  # PUSH ONLY. Half-width (deg) the goal heading is drawn
                             # from, around the object's OWN starting heading.
                             # null -> reuse theta_tol_deg (always satisfiable at
                             # reset). MEASURED: push rotates the object a median
                             # 1.8deg per episode (p90 7.0deg), so a uniform +/-180
                             # window would be reachable in ~16% of episodes.
                             # Diversity comes from object_theta_spread_deg.
gamma_goal: false            # RECONTACT ONLY. false (default, bit-identical, keeps
                             # the v23 checkpoints loadable) = the historical
                             # single-finger 2-D goal. true = Eq 13's canonical
                             # interface: BOTH fingertip targets in the object's
                             # frame + the desired touching flag for each (6-D).
                             # The object's pose is NOT in it -- recontact must not
                             # move the object. Per-finger tolerance comes from the
                             # interface table: the anchoring contact gets a few mm,
                             # a retracted finger only has to be clear.
goal_gamma_modes: null       # which interface classes the GOAL is drawn from.
                             # null -> all of (push, pivot, pinch).
init_gamma_modes: null       # which interface the fingers START in. null -> (free,),
                             # the historical both-disengaged reset. Adding the
                             # contact classes lets recontact represent a
                             # GRASP-TO-GRASP transition, which composition needs.
# --- observation version and its scales (physics.ObsScales) ---
# An INTERFACE key, like action_interface: it changes how the policy READS the
# world, not the reset distribution, reward or horizon. So it is EXCLUDED from
# the env digest, and obs v1 vs v2 are directly comparable on one benchmark.
#   1  the historical layout, bit-identical -- including its two missing
#      divisors (angular velocity went in raw at +/-3.27 while every
#      neighbouring velocity was scaled; force was divided by a 1000.0 fallback
#      against a measured p99 of 284/323) and the recontact frame mix, where
#      the goal tail differenced an OBJECT-frame target against the object's
#      WORLD position (measured mean -0.492, range 0.21).
#   2  xi always emitted at N_XI_V2=11, so the state+xi head is byte-identical
#      across push and recontact; angular velocity and force normalized; the
#      goal tail measured against the ACHIEVED goal; goal positions scaled by
#      the max same-room goal distance instead of the board extent (2.3x of the
#      range was being wasted -- measured std 0.039/0.071, the two weakest
#      signals in the vector). Requires rich_obs=true.
obs_version: 1
# Normalize ONLY achieved_goal/desired_goal, via SB3's VecNormalize. Also an
# INTERFACE key. Measured: those two keys' positions are the four
# highest-variance dims of the whole 49-D network input (std 7.79/7.55/4.64/3.93
# against a median of 0.227 -- a 34x ratio) because they are raw CENTIMETRES
# while `observation` is all in +/-1 and SB3 just Flattens every key.
# `observation` is deliberately NOT normalized: 22 of its dims are unit-vector
# pairs or one-hots, and whitening those destroys cos^2+sin^2=1 and "exactly
# one is 1". Safe with HER -- compute_reward runs on RAW arrays before
# normalization, so arrival_eps keeps meaning centimetres.
# The running stats are saved as vecnormalize.pkl beside model.zip and
# eval_contact.py REFUSES to score without them (both directions).
normalize_goal_keys: false
omega_max_rad_s: 3.0      # obs_version=2 only. Measured |omega| max 3.27, p99 1.04.
force_scale_kgcms2: 300.0 # obs_version=2 only, and only when force_abort_kgcms2
                          # is null (it always is). Measured peak-force p99 284/323.
rich_obs: false              # adds Eq 18's xi block (which template, which finger is
                             # active, which face) plus contact normals, force and the
                             # four nearest wall distances -- all object-centric.
                             # false is bit-identical. NOTE the force feature is
                             # CUMULATIVE PEAK force: instantaneous normal force is
                             # not recorded by the physics wrapper.
portal_arrival: false        # PUSH ONLY. Eq 13's crossing target is the PORTAL
                             # INTERFACE, not a point ("a portal is passed through,
                             # not stopped at"). true routes cross-room arrival
                             # through push_arrival's `iface` branch. Same-room
                             # keeps the point target either way. NOTE HER still
                             # scores relabeled pairs on the POINT goal: a portal
                             # set cannot be relabeled to from an achieved state.
push_range_max_cm: null      # PUSH ONLY, cone sampler only -- cap on the goal's
                             # distance at reset. Eq 15's ramp moves this.
curriculum_levels: null      # null -> OFF (bit-identical). Number of Eq 15 levels
                             # I^(1) subset ... subset I_e, expanding BACKWARD from
                             # the target along the goal-range axis.
curriculum_start_cm: null    # DEPRECATED 2026-09-03, raises if set. It only fed
                             # Eq 15's nested ramp, which was measured INERT
                             # (same-room median 2.02/1.94/2.15/1.78cm across
                             # four levels against 2.00 with no curriculum) and
                             # is deleted. No run ever set it. The key survives
                             # only so an archived config still parses.
                             # ORIGINAL: Low end of the Eq 15 ramp, in cm. MUST be >= the
                             # edge's geometric minimum goal distance or the cap is
                             # unsatisfiable: cross-room goals are >= ~15cm because
                             # the object must reach the other room, and a level-0
                             # cap below that leaks 100%. null -> derive from
                             # push_range_min_cm (fine same-room, WRONG cross-room).
curriculum_mode: nested     # PUSH ONLY. nested -> Eq 15 literally: levels are
                             # nested caps on start-to-target distance. MEASURED
                             # INERT on this board (same-room median 2.0cm at
                             # every level) because a nested level can only
                             # delete far starts. band -> the reverse curriculum
                             # of Florensa 2017 / Backplay 2018: draw the GOAL
                             # first, then place the object at a distance from a
                             # sliding window. Not nested, so it is a recorded
                             # DEVIATION from Eq 15; the citations are the
                             # justification. Requires push_cone_deg and
                             # curriculum_levels=4.
curriculum_threshold: 0.6    # Alg 1 line 13: advance when HELD-OUT local success
                             # clears this. The eval env is the held-out one and is
                             # NOT advanced, so the yardstick stays fixed.
her_settled: false           # PUSH ONLY. Whether an HER-RELABELED transition must
                             # also be settled, not just position-arrived.
                             # false (default, bit-identical to every run so far)
                             # keeps HER's rich position-only signal but lets a
                             # relabeled pair be marked terminal when the real env
                             # would not have terminated -- an optimistic critic.
                             # true is consistent but costs signal, and the cost is
                             # MEASURED: only 6% of push ticks pass object_settled
                             # (a pushing policy keeps the object moving), so HER
                             # positives fall 51-61% -> 5-8%, retaining 10-13%
                             # (tools/probe_p0_readiness.py settling). An ARM.

# --- contact-mode enforcement + portal target sets (P0) ---
guard_face: false         # push only -- also enforce the edge's contact FACE.
                          # Without it a finger that walks around a corner onto
                          # another face still passes "is touching", so the
                          # option can violate the edge it was told to execute
                          # and still be scored a success.
                          # false | true/strict | adjacent. `adjacent` forbids
                          # only the OPPOSITE face: rounding one corner costs
                          # <=4.0cm of finger travel, which contact_lost already
                          # allows, while the opposite face of a 10x6 object
                          # needs ~7.5cm. v31 measured strict at 0.000 on 9/9.
guard_object_still: false # recontact only -- the object must not move. That is
                          # recontact's standing invariant (the target interface
                          # cannot be, since acquiring it is the point). As a
                          # guard rather than an arrival term it is also visible
                          # to her_valid_filter.
portal_goal: false        # push only -- draw CROSSING-edge goals as poses from
                          # the portal region, and the object's start heading
                          # from the same admissible band. MEASURED: a 10x6
                          # object passes a 10cm gap at only 31% of
                          # orientations, so an unconstrained draw is ~69%
                          # geometrically impossible at any skill level.
portal_depth_cm: 2.0      # half-depth in x of the portal goal band
portal_clearance_cm: 0.5  # sec 3.1.2's "object width + 5-30mm"; the low end
continuous_gamma: false   # recontact only -- draw interfaces UNIFORMLY inside
                          # a class instead of from its 4/2/8 canonical
                          # placements, so Gamma_l is a target SET (sec 6.1).
gamma_min_sep_cm: 2.0     # floor on init-vs-goal interface separation, so a
                          # start that nearly matches the goal is not a free win
her_valid_filter: false   # relabel only TO ticks that were settled and
                          # guard-valid. Filters the candidate POOL, not the
                          # scored pair: her_settled rejects ~94% of a batch at
                          # the measured 6% settle rate, this costs no batch
                          # size at all.
